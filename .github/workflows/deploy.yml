name: Deploy a GitHub Pages

# El Excel NO vive en el repo (queda local): el sitio ya viene generado en data.js.
# Este workflow publica los archivos estáticos commiteados.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar el sitio estático
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
